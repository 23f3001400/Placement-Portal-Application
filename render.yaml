databases:
  - name: ppa-db
    plan: free
    databaseName: ppa
    user: ppa_user

services:
  # ── Web Service (Flask + Gunicorn) ────────────────────────────────────
  - type: web
    name: ppa-web
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ppa-db
          property: connectionString
      - key: REDIS_URL
        sync: false  # Set manually in Render dashboard (Upstash URL)
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: CACHE_REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SECURITY_PASSWORD_SALT
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: CELERY_ALWAYS_EAGER
        value: "true"
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: GCHAT_WEBHOOK_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.11"
